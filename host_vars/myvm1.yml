---
# PostgreSQL host-based auth grants (roles/postgres-hba).
# Owner request 2026-10-25: keep users, reduce places that can connect.
#
# Source addresses are LIVE-MEASURED, not guessed (pg_stat_ssl/pg_stat_activity on myvm1,
# 2026-10-25): every AWX connection arrives from 95.168.169.75. The cluster's node VMs
# (cp-node/worker1-3 = libvirt guests on myD1) SNAT through myD1's WAN IP, so pods on
# worker1/worker2 present 95.168.169.75 — NOT 95.168.174.67 and never pod/node-internal IPs.
# myvm1-itsself: local socket (peer) + loopback rules already cover it; the explicit /32
# below covers TCP clients that present the host's own public address.
postgres_hba_allowed_cidrs:
  - { database: awx, user: psqlreplicaba, address: 62.212.77.72/32 }
  - { database: awx, user: psqlreplicaba, address: 95.168.169.75/32 }
  # Monitoring postgres-exporter (prometheus-stack namespace, monitoring wave 2).
  # Same egress IPs as the MySQL exporter (security_firewall_mysql_sources):
  # myD1 (95.168.169.75) is the primary; myD2 (95.168.174.67) for failover.
  # hostssl: the exporter uses sslmode=require (traffic crosses the public internet).
  # The exporter connects to the default `postgres` database (--auto-discover-databases).
  # Role `exporter` must be created locally first (see README-monitoring-wave2.md Follow-up B).
  - { type: hostssl, database: postgres, user: exporter, address: 95.168.169.75/32 }
  - { type: hostssl, database: postgres, user: exporter, address: 95.168.174.67/32 }

# W0 hardening scope (roles/security-ssh/tasks/w0-hardening.yml):
# myvm1 has no /var/ssl haproxy key material and no antonio kubeconfig; only
# the forbidden-sshd-port guard (V1-4, the leftover port-1022 sshd) applies.
security_ssh_ssl_apply: false
security_ssh_kube_apply: false
