---
- name: Install base packages
  apt:
    name: "{{ item }}"
    state: "present"
  with_items:
    - postgresql-contrib
    - postgresql
    - python3-venv
    - python3-pip

- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv /home/antonioma/python-venv
    creates: /home/antonioma/python-venv/bin/activate

- name: Install psycopg2 library
  pip:
    name: psycopg2-binary
    virtualenv: /home/antonioma/python-venv
  become: yes

- name: Install hvac library
  pip:
    name: hvac
    virtualenv: /home/antonioma/python-venv
  become: yes

- name: Set python interpreter to virtualenv
  set_fact:
    ansible_python_interpreter: /home/antonioma/python-venv/bin/python

- name: Ensure PostgreSQL is started before query
  ansible.builtin.systemd:
    name: postgresql
    state: started
  when: inventory_hostname in groups['psql_master']

# Configure PSQL listen_address and other small configs
- name: modify postgresql.conf
  lineinfile:
    path: "/etc/postgresql/{{ psql_version }}/main/postgresql.conf"
    regexp: "^{{ item.regex }}"
    line: "{{ item.value }}"
  with_items:
    - { regex: listen_addresses , value: "listen_addresses = '{{ master_ip }}'" }
    - { regex: wal_level, value: "wal_level = logical" }
    - { regex: wal_log_hints, value: "wal_log_hints = on" }
    - { regex: max_wal_senders, value: "max_wal_senders = 2" }
  when: inventory_hostname in groups['psql_master']

- name: Read pg_replica_user from Vault
  uri:
    url: "{{ vault_addr }}/v1/ansible/data/pg_replica_user"
    method: GET
    headers:
      X-Vault-Token: "{{ vault_token }}"
  register: replica_secret

- set_fact:
    pg_replica_user: "{{ replica_secret.json.data.data.pg_replica_user }}"

- name: Read pg_replica_pass from Vault
  uri:
    url: "{{ vault_addr }}/v1/ansible/data/pg_replica_pass"
    method: GET
    headers:
      X-Vault-Token: "{{ vault_token }}"
  register: pg_replica_pass

- set_fact:
    pg_replica_pass: "{{ pg_replica_pass.json.data.data.pg_replica_pass }}"

- name: modify pg_hba.conf
  lineinfile:
    path: "/etc/postgresql/{{ psql_version }}/main/pg_hba.conf"
    regexp: '^{{ item.regex }}'
    line: "{{ item.value }}"
  with_items:
    - { regex: 'host\s{1,}{{ automation_database }}\s{1,}{{ pg_replica_user }}\s{1,}{{ client_ip }}.106/24\s{1,}md5' , value: "host {{ automation_database }} {{ pg_replica_user }} {{ client_ip }}/24 md5" }
  when: inventory_hostname in groups['psql_master']

