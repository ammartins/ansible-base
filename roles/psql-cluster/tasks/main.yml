- name: Restart postgresql Server
  ansible.builtin.systemd_service:
    state: restarted
    daemon_reload: true
    name: postgresql
  when: inventory_hostname in groups['psql_master']

- name: Create Replication User
  become: yes
  become_user: postgres
  postgresql_query:
    query: CREATE ROLE  {{ pg_replica_user }} WITH REPLICATION LOGIN PASSWORD  '{{ pg_replica_pass }}'
  when: inventory_hostname in groups['psql_master']
  no_log: true
  ignore_errors: true

- name: Create autoamtion DB
  become: yes
  become_user: postgres
  postgresql_db:
    name: "{{ automation_database }}"
    encoding: UTF8
    lc_collate: en_US.UTF-8
    lc_ctype: en_US.UTF-8
    state: present
  when: inventory_hostname in groups['psql_master']

- name: Create database owned by user
  become: yes
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ automation_database }}"
    owner: "{{ pg_replica_user }}"
    encoding: UTF8
    lc_collate: en_US.UTF-8
    lc_ctype: en_US.UTF-8
    state: present
