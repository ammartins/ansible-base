---
- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart opensearch
  ansible.builtin.service:
    name: opensearch
    state: restarted

- name: Reload nftables OpenSearch rules
  ansible.builtin.command: nft -f /etc/nftables.conf.opensearch
  changed_when: true

- name: Persist virbr0 K8s address
  ansible.builtin.debug:
    msg: >-
      NOTE: virbr0 address 192.168.122.1/24 is not persisted across reboots.
      Add it to /etc/network/interfaces or netplan for durability.
