---
- name: Install apt prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - openssl
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: opensearch_prereq

- name: Install the OpenSearch apt signing key
  ansible.builtin.get_url:
    url: "{{ opensearch_apt_key_url }}"
    dest: "{{ opensearch_apt_key_path }}"
    owner: root
    group: root
    mode: "0644"

# deb822_repository needs python3-debian on the target (installed above). Under
# --check on a host where that is not installed yet the module cannot run; that
# is expected exactly then and not an error.
- name: Add the OpenSearch 2.x apt repository
  ansible.builtin.deb822_repository:
    name: opensearch-2.x
    types: [deb]
    uris: "{{ opensearch_apt_repo_url }}"
    suites: [stable]
    components: [main]
    signed_by: "{{ opensearch_apt_key_path }}"
    state: present
  register: opensearch_repo
  failed_when: >-
    opensearch_repo.failed and
    not (ansible_check_mode and opensearch_prereq is changed)

# DISABLE_INSTALL_DEMO_CONFIG stops the postinst from writing demo certs and
# the admin:admin demo config. Under --check the new repo is not in the apt
# cache yet, so "package not found" is expected exactly then and not an error.
- name: Install the pinned OpenSearch package (no demo config)
  ansible.builtin.apt:
    name: "opensearch={{ opensearch_version }}"
    state: present
    update_cache: "{{ opensearch_repo is changed }}"
  environment:
    DISABLE_INSTALL_DEMO_CONFIG: "true"
  register: opensearch_pkg
  failed_when: >-
    opensearch_pkg.failed and
    not (ansible_check_mode and (opensearch_repo is changed or opensearch_prereq is changed))

- name: Look for the installed OpenSearch binary
  ansible.builtin.stat:
    path: /usr/share/opensearch/bin/opensearch
  register: opensearch_bin

# Config tasks need the opensearch user/dirs, which exist only after the
# package is installed (never the case under --check on a fresh host).
- name: Record whether the package is present
  ansible.builtin.set_fact:
    opensearch_ready: "{{ opensearch_bin.stat.exists }}"

- name: Note skipped configuration (check mode, package not installed yet)
  ansible.builtin.debug:
    msg: >-
      check mode: opensearch is not installed on this host yet, so the
      sysctl, TLS, configuration and service tasks cannot be evaluated and
      are skipped. They are unverified until the first apply.
  when: not opensearch_ready
