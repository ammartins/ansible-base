---
# Enable the firewall (default-deny inbound). Only reached after the
# verify-before-enable assert proves SSH is allowed, so this cannot lock out
# ops access. `state: enabled` is idempotent: if already active it is a no-op.
#
# community.general.ufw semantics:
#   - `default` sets the DEFAULT INBOUND policy (allow|deny|reject).
#   - Outgoing traffic is allowed by ufw default; we do not restrict it.

- name: Enable ufw (default-deny inbound, allow outgoing)
  community.general.ufw:
    state: enabled
    default: deny
  register: ufw_enable
  when: security_firewall_enable

- name: Confirm ufw is active after enable
  command: ufw status
  check_mode: false
  register: ufw_status_after
  changed_when: false
  failed_when: "'Status: active' not in ufw_status_after.stdout"
