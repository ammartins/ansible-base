---
- name: Install apt prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - openssl
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: osd_prereq

- name: Install the OpenSearch Dashboards apt signing key
  ansible.builtin.get_url:
    url: "{{ opensearch_dashboards_apt_key_url }}"
    dest: "{{ opensearch_dashboards_apt_key_path }}"
    owner: root
    group: root
    mode: "0644"

# deb822_repository needs python3-debian on the target (installed above).
- name: Add the OpenSearch Dashboards 2.x apt repository
  ansible.builtin.deb822_repository:
    name: opensearch-dashboards-2.x
    types: [deb]
    uris: "{{ opensearch_dashboards_apt_repo_url }}"
    suites: [stable]
    components: [main]
    signed_by: "{{ opensearch_dashboards_apt_key_path }}"
    state: present
  register: osd_repo
  failed_when: >-
    osd_repo.failed and
    not (ansible_check_mode and osd_prereq is changed)

- name: Install the pinned OpenSearch Dashboards package
  ansible.builtin.apt:
    name: "opensearch-dashboards={{ opensearch_dashboards_version }}"
    state: present
    update_cache: "{{ osd_repo is changed }}"
  register: osd_pkg
  failed_when: >-
    osd_pkg.failed and
    not (ansible_check_mode and (osd_repo is changed or osd_prereq is changed))

- name: Look for the installed OpenSearch Dashboards binary
  ansible.builtin.stat:
    path: /usr/share/opensearch-dashboards/bin/opensearch-dashboards
  register: osd_bin

# Config tasks need the opensearch-dashboards user/dirs, which exist only
# after the package is installed (never the case under --check on a fresh host).
- name: Record whether the package is present
  ansible.builtin.set_fact:
    opensearch_dashboards_ready: "{{ osd_bin.stat.exists }}"

- name: Note skipped configuration (check mode, package not installed yet)
  ansible.builtin.debug:
    msg: >-
      check mode: opensearch-dashboards is not installed on this host yet, so the
      configuration and service tasks cannot be evaluated and are skipped. They are
      unverified until the first apply.
  when: not opensearch_dashboards_ready
