---
# Everything here is a default; override per host or per group in host_vars /
# group_vars. The role deliberately does NOT change the SSH port (the ssh role
# owns that) and does NOT create users or keys (also the ssh role's job), so it
# can run on hosts where ssh has not run yet without fighting it.

# Keys-only auth. This refuses console+SSH password logins. It is safe only
# while every human account has a working authorized_key. If a host still uses
# console password logins (e.g. rescue environments), set
# security_ssh_password_auth: false in that host's vars before applying.
security_ssh_password_auth: true

# Idle timeout: drop dead sessions after ClientAliveInterval*CountMax seconds.
security_ssh_client_alive_interval: 300
security_ssh_client_alive_count_max: 3

security_ssh_x11_forwarding: false

# Port sshd really listens on; the fail2ban jail must ban that port, not 22.
# Follows the inventory (ansible_port / ansible_ssh_port) so it tracks reality
# per host; the verify step asserts sshd -T agrees. Override per host if the
# connection port differs from the listening port (e.g. behind NAT).
security_ssh_port: "{{ ansible_port | default(ansible_ssh_port | default(22)) }}"

# Cloud images often ship /etc/ssh/sshd_config.d/50-cloud-init.conf with
# "PasswordAuthentication yes", which wins over later drop-ins. The role
# comments that line out (keeping a .disabled backup) so keys-only actually
# takes effect. Set false to leave cloud-init's file untouched.
security_ssh_disable_cloud_init_password_override: true

fail2ban_package: fail2ban
fail2ban_sshd_jail: true

# Jail behaviour: 5 failures within 10 minutes -> 10 minute ban, doubling per
# repeat ban (bantime.increment below) up to bantime.maxtime.
fail2ban_sshd_maxretry: 5
fail2ban_sshd_findtime: 600
fail2ban_sshd_bantime: 600
fail2ban_sshd_bantime_max: 86400

# Never ban ourselves or the trusted LANs. The management network from the
# inventory (10.10.10.0/24 on the homelab, plus the VM provider nets below) is
# whitelisted; add what you need in group_vars.
fail2ban_ignore_ip:
  - 127.0.0.1/8
  - ::1

# Post-converge verification (read-only): assert `sshd -T` and the live
# fail2ban sshd jail match what this role rendered. Set false per host in
# host_vars to bypass (templates are still converged).
security_ssh_verify: true

# ---------------------------------------------------------------- W0 hardening
# Fleet rule (W0.3, report finding V1-4): no sshd listener may exist on any
# port other than the intended one. The classic offender is the temporary
# sshd that `do-release-upgrade` spawns on 1022 (PidFile
# /var/run/release-upgrader-sshd.pid) and that nobody ever kills afterwards.
# The role asserts 1022 has no listener and, if a leftover process or unit is
# found, stops and disables it before re-checking.
security_ssh_forbidden_ports:
  - 1022

# Set false per host to skip the forbidden-port assert/kill entirely.
security_ssh_forbidden_ports_enforce: true

# Owners of the TLS material this role locks down (W0.1, findings D1-2/D2-1
# and D1-7/D2-7). Overridable per host; the haproxy on myD1/myD2 runs as root
# with master-worker so it can keep reading 0640 root:haproxy keys after a
# reload.
security_ssh_ssl_dir: /var/ssl
security_ssh_ssl_key_group: haproxy

# Master switch for the W0 hardening tasks (TLS key perms, kubeconfig perms,
# forbidden sshd port guard). Set false per host to skip.
security_ssh_w0_hardening: true

# Home .kube directories to lock down (owner is taken from the dir itself).
security_ssh_kube_dirs:
  - /home/antonio/.kube

# Set true to run only the W0 hardening tasks (skip sshd drop-in/fail2ban
# converge + verification). Used by playbooks/w0-hardening.yml.
security_ssh_skip_converge: false

# Apply the /var/ssl key-perm tasks on this host (myD1/myD2 yes, plain VMs no).
security_ssh_ssl_apply: true

# Apply the ~/.kube lock-down tasks on this host.
security_ssh_kube_apply: true
