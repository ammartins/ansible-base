---
- name: Install fail2ban
  apt:
    name: "{{ fail2ban_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Write sshd hardening drop-in
  template:
    src: 50-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/50-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: "sshd -t -f %s"
  notify: Reload ssh

- name: Disable cloud-init password-auth override (it wins over drop-ins)
  copy:
    src: /etc/ssh/sshd_config.d/50-cloud-init.conf
    dest: "/etc/ssh/sshd_config.d/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
    force: false
  loop:
    - 50-cloud-init.conf.disabled-by-security-ssh
  when:
    - security_ssh_disable_cloud_init_password_override
    - security_ssh_password_auth
  register: cloudinit_backup
  failed_when: false

- name: Comment out PasswordAuthentication in cloud-init drop-in
  replace:
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf
    regexp: '^(?=#?)PasswordAuthentication yes'
    replace: '#PasswordAuthentication yes  # disabled by security-ssh role: keys only'
  when:
    - security_ssh_disable_cloud_init_password_override
    - security_ssh_password_auth
  notify: Reload ssh
  failed_when: false

- name: Write fail2ban jail.local
  template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Write fail2ban sshd filter (journal match for sshd-session)
  template:
    src: filter-sshd.local.conf.j2
    dest: /etc/fail2ban/filter.d/sshd.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable and start fail2ban
  service:
    name: fail2ban
    state: started
    enabled: true
