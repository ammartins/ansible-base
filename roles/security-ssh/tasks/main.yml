---
# security-ssh: sshd hardening drop-in + fail2ban sshd jail.
#
# Converge: both templates are rendered unconditionally on every run (no
# creates:/when: guards), so a drifted host is re-rendered and the handlers
# reload sshd / restart fail2ban.
#
# Verify: after converging, handlers are flushed and the role asserts that
#   * sshd's EFFECTIVE config (`sshd -T`) matches the intent, which catches a
#     drop-in ordering problem or a cloud-init file defeating the hardening;
#   * the LIVE fail2ban sshd jail (`fail2ban-client get sshd ...`) matches the
#     rendered template values, which catches stale/never-applied jails.
# Both checks are read-only (changed_when: false). To bypass on one host, set
# security_ssh_verify: false in its host_vars (the converge tasks still run).
- name: Install fail2ban
  apt:
    name: "{{ fail2ban_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Write sshd hardening drop-in
  template:
    src: 50-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/50-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: "sshd -t -f %s"
  register: security_ssh_dropin
  notify: Reload ssh

- name: Look for the cloud-init sshd drop-in and its role backup
  stat:
    path: "{{ item }}"
  loop:
    - /etc/ssh/sshd_config.d/50-cloud-init.conf
    - /etc/ssh/sshd_config.d/50-cloud-init.conf.disabled-by-security-ssh
  register: security_ssh_cloudinit_stat
  when:
    - security_ssh_disable_cloud_init_password_override
    - security_ssh_password_auth

- name: Back up the cloud-init drop-in before touching it
  copy:
    src: /etc/ssh/sshd_config.d/50-cloud-init.conf
    dest: /etc/ssh/sshd_config.d/50-cloud-init.conf.disabled-by-security-ssh
    remote_src: true
    owner: root
    group: root
    mode: "0600"
    force: false
  when:
    - security_ssh_cloudinit_stat is not skipped
    - (security_ssh_cloudinit_stat.results | selectattr('item', 'search', 'conf$') | first).stat.exists

# The backup must not keep a live "PasswordAuthentication yes": sshd ignores
# it (only *.conf is included) but a later `mv`/`cp` back would silently undo
# the hardening, so neutralize the content of both files.
- name: Comment out PasswordAuthentication in cloud-init drop-in and its backup
  replace:
    path: "{{ item.item }}"
    regexp: '^PasswordAuthentication\s+yes\s*$'
    replace: '#PasswordAuthentication yes  # disabled by security-ssh role: keys only'
  loop: "{{ security_ssh_cloudinit_stat.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  register: security_ssh_cloudinit_replace
  when:
    - security_ssh_cloudinit_stat is not skipped
    - item.stat.exists
  notify: Reload ssh

- name: Write fail2ban jail.local
  template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  register: security_ssh_jail
  notify: Restart fail2ban

- name: Write fail2ban sshd filter (journal match for sshd-session)
  template:
    src: filter-sshd.local.conf.j2
    dest: /etc/fail2ban/filter.d/sshd.local
    owner: root
    group: root
    mode: "0644"
  register: security_ssh_filter
  notify: Restart fail2ban

- name: Enable and start fail2ban
  service:
    name: fail2ban
    state: started
    enabled: true

# ---------------------------------------------------------------- verification
# Under --check nothing is written, so `sshd -T` and the live jail still show
# the OLD state and the asserts below would fail on every host that has drift
# to converge. In that case report the pending drift and skip the asserts (they
# run for real on apply, and in --check once the host has converged).
- name: Work out whether verification is meaningful in this run
  set_fact:
    security_ssh_verify_now: >-
      {{ security_ssh_verify and not (ansible_check_mode and
         ([security_ssh_dropin, security_ssh_jail, security_ssh_filter,
           security_ssh_cloudinit_replace | default({})] | selectattr('changed', 'defined')
           | selectattr('changed') | list | length > 0)) }}

- name: Note skipped verification (check mode with pending changes)
  debug:
    msg: >-
      check mode: sshd/fail2ban changes are pending, so the effective-config
      and live-jail assertions are not evaluated (unverified until applied).
  when: security_ssh_verify and not security_ssh_verify_now

- name: Flush handlers so verification sees the converged state
  meta: flush_handlers
  when: security_ssh_verify_now

- name: Read effective sshd configuration
  command: sshd -T
  register: security_ssh_sshd_effective
  changed_when: false
  check_mode: false
  when: security_ssh_verify_now

- name: Assert effective sshd configuration matches the hardening intent
  assert:
    that:
      - security_ssh_sshd_effective.stdout is search('(?im)^passwordauthentication\s+' ~ ('no' if security_ssh_password_auth else 'yes') ~ '\s*$')
      - security_ssh_sshd_effective.stdout is search('(?im)^permitrootlogin\s+(prohibit-password|without-password)\s*$')
      - security_ssh_sshd_effective.stdout is search('(?im)^port\s+' ~ security_ssh_port ~ '\s*$')
      - security_ssh_sshd_effective.stdout is search('(?im)^clientaliveinterval\s+' ~ security_ssh_client_alive_interval ~ '\s*$')
      - security_ssh_sshd_effective.stdout is search('(?im)^clientalivecountmax\s+' ~ security_ssh_client_alive_count_max ~ '\s*$')
    fail_msg: >-
      Effective sshd config (sshd -T) does not match the security-ssh
      hardening drop-in. Another file in /etc/ssh/sshd_config.d/ or
      /etc/ssh/sshd_config (e.g. cloud-init) is overriding it. Expected
      passwordauthentication {{ 'no' if security_ssh_password_auth else 'yes' }},
      port {{ security_ssh_port }} (the fail2ban jail port),
      permitrootlogin prohibit-password (older OpenSSH prints it as without-password),
      clientaliveinterval {{ security_ssh_client_alive_interval }},
      clientalivecountmax {{ security_ssh_client_alive_count_max }}.
    quiet: true
  when: security_ssh_verify_now

- name: Read live fail2ban sshd jail settings
  command: "fail2ban-client get sshd {{ item }}"
  loop:
    - maxretry
    - findtime
    - bantime
  register: security_ssh_jail_live
  changed_when: false
  check_mode: false
  retries: 5
  delay: 2
  until: security_ssh_jail_live.rc == 0
  failed_when: false
  when:
    - security_ssh_verify_now
    - fail2ban_sshd_jail

- name: Assert live fail2ban sshd jail matches the rendered template
  assert:
    that:
      - security_ssh_jail_live.results | rejectattr('rc', 'equalto', 0) | list | length == 0
      - (security_ssh_jail_live.results | selectattr('item', 'equalto', 'maxretry') | first).stdout | trim == fail2ban_sshd_maxretry | string
      - (security_ssh_jail_live.results | selectattr('item', 'equalto', 'findtime') | first).stdout | trim == fail2ban_sshd_findtime | string
      - (security_ssh_jail_live.results | selectattr('item', 'equalto', 'bantime') | first).stdout | trim == fail2ban_sshd_bantime | string
    fail_msg: >-
      fail2ban sshd jail is missing, not running, or differs from
      /etc/fail2ban/jail.local (expected maxretry={{ fail2ban_sshd_maxretry }},
      findtime={{ fail2ban_sshd_findtime }}, bantime={{ fail2ban_sshd_bantime }}).
      Live values: {{ security_ssh_jail_live.results | map(attribute='stdout') | list }}.
      Check `fail2ban-client status` and `journalctl -u fail2ban`.
    quiet: true
  when:
    - security_ssh_verify_now
    - fail2ban_sshd_jail

# A jail can have the right maxretry/findtime/bantime and still be blind if its
# journalmatch selects no events. Compare what ssh.service logged in the last
# 24h with what the jail's own journalmatch selects: zero failures in the unit
# is fine (nothing to see); failures present but none selected is a blind jail.
- name: Read live fail2ban sshd journalmatch
  command: fail2ban-client get sshd journalmatch
  register: security_ssh_journalmatch
  changed_when: false
  check_mode: false
  retries: 5
  delay: 2
  until: security_ssh_journalmatch.rc == 0
  when:
    - security_ssh_verify_now
    - fail2ban_sshd_jail

- name: Count sshd failures in the journal (whole unit, last 24h)
  shell: >-
    journalctl _SYSTEMD_UNIT=ssh.service --since=-24h -o cat --no-pager
    | grep -cE 'Failed password|Invalid user'
  register: security_ssh_failures_unit
  changed_when: false
  failed_when: security_ssh_failures_unit.rc not in [0, 1]
  check_mode: false
  when:
    - security_ssh_verify_now
    - fail2ban_sshd_jail

- name: Count sshd failures selected by the jail's journalmatch (last 24h)
  shell: >-
    journalctl {{ security_ssh_journalmatch.stdout
    | regex_findall('[A-Z_]+=[A-Za-z0-9_.@:-]+|\+') | map('quote') | join(' ') }}
    --since=-24h -o cat --no-pager
    | grep -cE 'Failed password|Invalid user'
  register: security_ssh_failures_jail
  changed_when: false
  failed_when: security_ssh_failures_jail.rc not in [0, 1]
  check_mode: false
  when:
    - security_ssh_verify_now
    - fail2ban_sshd_jail

- name: Assert the fail2ban sshd jail actually sees sshd failures
  assert:
    that:
      - security_ssh_journalmatch.stdout is search('[A-Z_]+=')
      - (security_ssh_failures_unit.stdout | trim | int == 0)
        or (security_ssh_failures_jail.stdout | trim | int > 0)
    fail_msg: >-
      fail2ban sshd jail is blind: ssh.service logged
      {{ security_ssh_failures_unit.stdout | trim }} failure line(s) in the last
      24h but the jail's journalmatch ({{ security_ssh_journalmatch.stdout | trim }})
      selects {{ security_ssh_failures_jail.stdout | trim }}. Compare _COMM in
      `journalctl -o verbose -n 1 _SYSTEMD_UNIT=ssh.service` with the journalmatch
      in /etc/fail2ban/filter.d/sshd.local.
    quiet: true
  when:
    - security_ssh_verify_now
    - fail2ban_sshd_jail
