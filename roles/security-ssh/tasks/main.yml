---
# security-ssh: sshd hardening drop-in + fail2ban sshd jail + W0 hardening.
#
# Converge: both templates are rendered unconditionally on every run (no
# creates:/when: guards), so a drifted host is re-rendered and the handlers
# reload sshd / restart fail2ban. Set security_ssh_skip_converge: true to run
# only the W0 hardening tasks (playbooks/w0-hardening.yml does exactly that).
- name: Converge sshd hardening and fail2ban
  include_tasks: converge.yml
  when: not security_ssh_skip_converge

# ------------------------------------------------------------------ W0 hardening
# TLS key perms (/var/ssl), kubeconfig perms (~/.kube), and the forbidden-
# port sshd guard. See tasks/w0-hardening.yml; all knobs in defaults/main.yml.
- name: Apply W0 hardening (TLS key perms, kubeconfig perms, forbidden sshd ports)
  include_tasks: w0-hardening.yml
  when: security_ssh_w0_hardening
