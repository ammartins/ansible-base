---
# Read-only audit account(s) on myvm6 only (group audit-donna). All tasks live
# in roles/audit-user; the accounts are defined by audit_user_accounts.
- name: Audit user
  hosts: 'audit-donna'
  connection: ssh
  gather_facts: "False"
  become: "yes"
  tags: audit-user
  roles:
    - { role: ../roles/audit-user }
