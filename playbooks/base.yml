- name: Update Machines
  hosts: 'all-machines'
  connection: ssh
  gather_facts: "False"
  user: root
  max_fail_percentage: 0
  tags: update
  roles:
    - { role: ../roles/update }

- name: Initial Machine Setup
  hosts: 'all-machines'
  connection: ssh
  gather_facts: "False"
  user: root
  tags: init
  max_fail_percentage: 0
  roles:
    - { role: ../roles/base }

- name: SSH hardening and fail2ban
  hosts: 'all-machines'
  connection: ssh
  gather_facts: "true"
  user: root
  tags: security
  max_fail_percentage: 0
  roles:
    - { role: ../roles/security-ssh }
